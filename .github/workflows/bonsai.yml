name: bonsai
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bonsai.yml
permissions:
  contents: write
concurrency:
  group: bonsai-${{ github.ref }}
  cancel-in-progress: false
jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Upstream's native crop keeps the full animation without empty margins.
      - uses: egorthinks/git-bonsai@bec04c39f62731fdb28c3b82322ef21cbf3bdfac
